name: SafeWire CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: jac install
      - run: jac check -p -n main.jac endpoints.sv.jac frontend.cl.jac
      - run: jac test test_safewire.jac
      - run: bash scripts/check_jac_share.sh
